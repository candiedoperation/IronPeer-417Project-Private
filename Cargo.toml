[package]
name = "ironpeer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_bencode = "0.2"
sha1 = "0.10"

url = "2.5"

clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rustls = "0.23.35"
webpki-roots = "1.0.4"
rustls-pki-types = "1.13.1"
